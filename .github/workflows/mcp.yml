name: MCP contracts
on:
  push:
    paths: ['agentes/mcp/**', 'src/pedidos/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['agentes/mcp/**', 'src/pedidos/**', '.github/workflows/mcp.yml']
jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agentes/mcp/requirements-lock.txt
      - run: python -m pip install -r agentes/mcp/requirements-lock.txt
      - run: python -B -m pytest -q -p no:cacheprovider agentes/mcp/pruebas
