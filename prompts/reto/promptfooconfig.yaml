      value: file://../criterios/aserciones.py:identidad
    - type: python
      metric: invest
      value: file://../criterios/aserciones.py:invest
    - type: python
      metric: observable
      value: file://../criterios/aserciones.py:observable
    - type: python
      metric: cobertura
      value: file://../criterios/aserciones.py:cobertura
    - type: python
      metric: integridad
      value: file://../criterios/aserciones.py:integridad
